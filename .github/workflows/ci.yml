name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Includes the access-rule tests, which run the migrations in a real
      # Postgres (PGlite) and check that only invited members can read prayers.
      - run: npm test
      # Builds without the Supabase secrets; the site then shows a setup notice.
      - run: npm run build
